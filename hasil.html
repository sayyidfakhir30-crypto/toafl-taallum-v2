<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة اختبار TOAFL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Tajawal', sans-serif; }
  h1, h2, h3 { font-family: 'Amiri', serif; }
</style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 text-center border border-slate-200">
    <div class="w-16 h-16 bg-emerald-100 text-emerald-800 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-2xl">
      ✓
    </div>
    
    <h1 class="text-3xl font-bold text-slate-800 mb-1">انتهى الاختبار!</h1>
    <p class="text-xs text-slate-500 mb-6">فيما يلي نتيجة اختبار TOAFL الخاص بك</p>

    <!-- KOTAK SKOR (BAHASA ARAB) -->
    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6">
      <p class="text-xs font-semibold text-emerald-800 uppercase tracking-wide">الدرجة الكلية</p>
      <p id="totalScore" class="text-4xl font-extrabold text-emerald-950 my-1">0</p>
      
      <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-emerald-200/60 text-xs">
        <div class="bg-white p-2 rounded-lg shadow-sm border border-emerald-100">
          <p class="text-slate-500">فهم المسموع</p>
          <p id="scoreIs" class="font-bold text-emerald-900 text-sm">0</p>
        </div>
        <div class="bg-white p-2 rounded-lg shadow-sm border border-emerald-100">
          <p class="text-slate-500">فهم التراكيب</p>
          <p id="scoreTa" class="font-bold text-emerald-900 text-sm">0</p>
        </div>
        <div class="bg-white p-2 rounded-lg shadow-sm border border-emerald-100">
          <p class="text-slate-500">فهم المقروء</p>
          <p id="scoreQi" class="font-bold text-emerald-900 text-sm">0</p>
        </div>
      </div>
    </div>

    <!-- PEMBERITAHUAN (BAHASA INDONESIA) & TOMBOL -->
    <div class="space-y-3" dir="ltr">
      <p class="text-xs text-slate-600 leading-relaxed text-center">
        Ingin menerbitkan sertifikat resmi ber-QR Code? Silakan hubungi Admin untuk proses pembayaran & penerbitan.
      </p>

      <!-- TOMBOL WA ADMIN -->
      <a id="waBtn" href="#" target="_blank" 
         class="block w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 text-center">
        Hubungi Admin via WhatsApp
      </a>

      <!-- TOMBOL ULANGI UJIAN (BAHASA ARAB) -->
      <a href="index.html" 
         class="block w-full border border-emerald-700 text-emerald-800 hover:bg-emerald-50 font-bold py-3 px-4 rounded-xl transition duration-200 text-center font-sans" dir="rtl">
        إعادة الاختبار
      </a>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || '-';
  const total = params.get('total') || '0';
  const is = params.get('is') || '0';
  const ta = params.get('ta') || '0';
  const qi = params.get('qi') || '0';

  document.getElementById('totalScore').textContent = total;
  document.getElementById('scoreIs').textContent = is;
  document.getElementById('scoreTa').textContent = ta;
  document.getElementById('scoreQi').textContent = qi;

  // PESAN OTOMATIS WHATSAPP
  const waMessage = `Halo Admin, saya sudah selesai ujian TOAFL dan ingin menerbitkan sertifikat.

Nama: ${name}
Skor Total: ${total}
- Listening: ${is}
- Structure: ${ta}
- Reading: ${qi}`;

  document.getElementById('waBtn').href = `https://wa.me/6287898154180?text=${encodeURIComponent(waMessage)}`;
</script>
</body>
</html>
