  {title:"اللغة العربية والهوية", text:"ترتبط اللغة العربية ارتباطًا وثيقًا بالهوية الثقافية للناطقين بها، فهي ليست مجرد وسيلة للتواصل، بل وعاء يحمل تراثًا فكريًا وأدبيًا ممتدًا عبر قرون. ومن هنا تنبع أهمية الحفاظ عليها وتعليمها للأجيال الجديدة، خاصة في ظل انتشار اللغات الأجنبية وتأثيرها المتزايد على استخدامات اللغة اليومية.", q:[{q:"بم ترتبط اللغة العربية حسب النص؟", o:["بالاقتصاد","بالهوية الثقافية","بالسياسة فقط","بالتجارة"], a:1},{q:"ماذا تحمل اللغة العربية غير التواصل؟", o:["تراثًا فكريًا وأدبيًا","لا شيء","معلومات تقنية فقط","أرقامًا"], a:0},{q:"لماذا يجب الحفاظ على اللغة العربية حسب النص؟", o:["لأنها سهلة","لأنها وعاء للتراث والهوية","لأنها الوحيدة الموجودة","لا سبب"], a:1},{q:"ما الذي يهدد استخدامات اللغة اليومية حسب النص؟", o:["انتشار اللغات الأجنبية","قلة السكان","الحروب","الفقر"], a:0},{q:"ما الفكرة الرئيسية للنص؟", o:["أهمية الذكاء وحده","أهمية اللغة العربية للهوية الثقافية","قواعد النحو","أنواع اللهجات"], a:1}]}
];

function buildSteps(){
  const steps = [];
  ISTIMA.forEach((s, i) => steps.push({
    type: 'istima', sectionLabel: 'فهم المسموع (Listening)', context: null, audio: s.audio, title: s.title,
    questions: s.q.map((qq, qi) => ({...qq, id: `is-${i}-${qi}`, section: 'istima'}))
  }));
  for(let i = 0; i < TARAKIB.length; i += 5){
    const chunk = TARAKIB.slice(i, i + 5).map((t, ti) => ({...t, id: `ta-${i}-${ti}`, section: 'tarakib'}));
    steps.push({ type: 'tarakib', sectionLabel: 'فهم التراكيب والقواعد (Structure)', context: null, title: 'أسئلة القواعد', questions: chunk });
  }
  QIROAAH.forEach((p, i) => steps.push({
    type: 'qiroaah', sectionLabel: 'فهم المقروء (Reading)', context: p.text, title: p.title,
    questions: p.q.map((qq, qi) => ({...qq, id: `qi-${i}-${qi}`, section: 'qiroaah'}))
  }));
  return steps;
}

const STEPS = buildSteps();

let screen = 'landing';
let participantName = '';
let stepIndex = 0;
let answers = {};

function convertSubScore(correct, max) {
  if (max === 0) return 31;
  return 31 + Math.round((correct / max) * 37);
}

function computeScore() {
  let secCorrect = {istima: 0, tarakib: 0, qiroaah: 0};
  let secMax = {istima: 30, tarakib: 20, qiroaah: 50};

  STEPS.forEach(st => st.questions.forEach(q => {
    if(answers[q.id] === q.a) {
      secCorrect[q.section]++;
    }
  }));

  const subIs = convertSubScore(secCorrect.istima, secMax.istima);
  const subTa = convertSubScore(secCorrect.tarakib, secMax.tarakib);
  const subQi = convertSubScore(secCorrect.qiroaah, secMax.qiroaah);

  const scaled = Math.round(((subIs + subTa + subQi) / 3) * 10);

  return { scaled, subIs, subTa, subQi };
}

function selectOpt(id, oi) {
  answers[id] = oi;
  render(false);
}

function prevStep() {
  if (stepIndex > 0) {
    stepIndex--;
    render(true);
  }
}

function nextStep() {
  if (stepIndex < STEPS.length - 1) {
    stepIndex++;
    render(true);
  } else {
    const res = computeScore();
    window.location.href = `hasil.html?name=${encodeURIComponent(participantName)}&total=${res.scaled}&is=${res.subIs}&ta=${res.subTa}&qi=${res.subQi}`;
  }
}

function render(shouldScroll = true) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (shouldScroll) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  if (screen === 'landing') {
    app.innerHTML = `
      <div class="bg-emerald-900 text-white rounded-2xl p-6 md:p-8 mb-6 shadow-lg text-center relative overflow-hidden">
        <p class="text-amber-300 text-xs tracking-widest uppercase mb-2 font-bold">TEST OF ARABIC AS A FOREIGN LANGUAGE</p>
        <h1 class="text-3xl md:text-4xl font-bold mb-3">اختبر مستواك في اللغة العربية</h1>
        <p class="text-emerald-100 text-sm leading-relaxed max-w-xl mx-auto mb-6">
          ١٠٠ سؤال في الاستماع والتراكيب والقراءة. اختبار مجاني بالكامل — تدفع فقط عند رغبتك بإصدار الشهادة الرسمية.
        </p>
        <div class="flex justify-center gap-4 text-center">
          <div class="bg-white/10 border border-amber-300/30 rounded-xl p-3 flex-1 max-w-[100px]"><b class="block text-xl text-amber-200">١٠٠</b><span class="text-xs text-emerald-200">سؤال</span></div>
          <div class="bg-white/10 border border-amber-300/30 rounded-xl p-3 flex-1 max-w-[100px]"><b class="block text-xl text-amber-200">٣</b><span class="text-xs text-emerald-200">أقسام</span></div>
          <div class="bg-white/10 border border-amber-300/30 rounded-xl p-3 flex-1 max-w-[100px]"><b class="block text-xl text-amber-200">١٠٠</b><span class="text-xs text-emerald-200">دقيقة</span></div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-100 mb-6">
        <h3 class="text-xl font-bold text-emerald-900 mb-2">تعليمات واشتراطات الاختبار</h3>
        <ul class="text-sm text-slate-600 leading-relaxed space-y-2 mb-4 list-disc list-inside">
          <li>يتكون الاختبار من ٣ أجزاء: فهم المسموع (٣٠ سؤالاً)، فهم التراكيب (٢٠ سؤالاً)، وفهم المقروء (٥٠ سؤالاً).</li>
          <li>يمكنك الاطلاع على النتيجة فور الانتهاء من جميع الأسئلة مجانًا.</li>
        </ul>

        <div class="bg-amber-50 border border-amber-200 text-amber-900 text-xs p-3.5 rounded-xl mb-6 leading-relaxed font-sans" dir="ltr">
          <b>Catatan:</b> Sertifikat ini diterbitkan secara independen oleh <b>Ta'allum Arabic</b> sebagai bukti kualifikasi kemampuan bahasa Arab dan berkas pendukung.
        </div>

        <label class="block text-xs font-bold text-slate-600 uppercase mb-2">اسم المشارك (كما سيظهر في الشهادة)</label>
        <input type="text" id="nameInput" class="w-full p-3.5 border border-slate-200 rounded-xl mb-4 focus:outline-none focus:border-emerald-600 bg-slate-50 text-base" placeholder="أدخل اسمك الكامل هنا..." value="${participantName}">
        <button id="startBtn" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-4 rounded-xl shadow-md transition">ابدأ الاختبار الآن</button>
      </div>
    `;

    setTimeout(() => {
      document.getElementById('startBtn').onclick = () => {
        const val = document.getElementById('nameInput').value.trim();
        if(!val) return alert('الرجاء كتابة الاسم للبدء');
        participantName = val;
        stepIndex = 0;
        answers = {};
        screen = 'quiz';
        render(true);
      };
    }, 0);
  }

  else if (screen === 'quiz') {
    const step = STEPS[stepIndex];
    const pct = Math.round(((stepIndex + 1) / STEPS.length) * 100);

    let qHtml = '';
    step.questions.forEach(q => {
      const opts = q.o.map((opt, oi) => 
        `<div class="opt-btn ${answers[q.id] === oi ? 'selected' : ''}" onclick="selectOpt('${q.id}', ${oi})">${opt}</div>`
      ).join('');
      qHtml += `<div id="q-box-${q.id}" class="mb-6 pb-4 border-b border-dashed border-slate-200"><div class="font-bold text-base text-emerald-900 mb-3">${q.q}</div>${opts}</div>`;
    });

    app.innerHTML = `
      <div class="flex justify-between items-center mb-3 text-xs text-slate-500 font-bold">
        <span>الخطوة ${stepIndex + 1} من ${STEPS.length}</span>
        <span>${pct}%</span>
      </div>
      <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-6">
        <div class="bg-emerald-600 h-full transition-all duration-300" style="width:${pct}%"></div>
      </div>

      <span class="inline-block bg-emerald-800 text-white text-xs font-bold px-3 py-1 rounded-full mb-4">${step.sectionLabel}</span>

      ${step.audio ? `
        <div class="bg-slate-100 p-4 rounded-xl mb-4 border border-slate-200">
          <audio controls class="w-full"><source src="${step.audio}" type="audio/mpeg"></audio>
        </div>` : ''}

      ${step.context ? `
        <div class="bg-emerald-950 text-slate-100 p-5 rounded-2xl mb-6 font-serif text-lg leading-loose border border-emerald-800">
          <span class="text-xs text-amber-300 uppercase tracking-widest block font-sans mb-2">نص القراءة</span>
          ${step.context}
        </div>` : ''}

      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-100 mb-6">
        <h3 class="text-lg font-bold text-emerald-900 mb-4">${step.title}</h3>
        ${qHtml}
      </div>

      <div class="flex gap-3">
        ${stepIndex > 0 ? `<button onclick="prevStep()" class="flex-1 border border-emerald-800 text-emerald-800 font-bold py-3.5 rounded-xl">السابق</button>` : ''}
        <button onclick="nextStep()" class="flex-1 bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3.5 rounded-xl shadow-md">
          ${stepIndex === STEPS.length - 1 ? 'إنهاء الاختبار' : 'التالي'}
        </button>
      </div>
    `;
  }
}

render(true);
</script>
</body>
</html>
